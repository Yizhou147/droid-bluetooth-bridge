name: build-bthci-bridge

permissions:
  contents: read

# 本机是 arm64 Linux 且没有 NDK（NDK 只发 x86_64 host），所以交叉编译放云端做。
# 产物：out/bthci-bridge（aarch64 / Android 13+ / 链接 libbinder_ndk）
on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "build.sh"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 先看 runner 给了什么（上次失败就是因为盲目 sdkmanager 装固定版本号）
      - name: 探测可用 NDK
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-<未设置>}"
          echo "ANDROID_NDK_PATH=${ANDROID_NDK_PATH:-<未设置>}"
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null || echo "预装目录里没有 ndk"
          ls /usr/local/lib/android/sdk 2>/dev/null || true

      - name: 定位或安装 NDK
        run: |
          set -uo pipefail
          CC_REL="toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang++"
          found=""
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            found="$ANDROID_NDK_HOME"
          fi
          if [ -z "$found" ]; then
            for c in /usr/local/lib/android/sdk/ndk/* "$HOME/android-sdk/ndk"/*; do
              if [ -x "$c/$CC_REL" ]; then found="$c"; break; fi
            done
          fi
          if [ -n "$found" ] && [ ! -x "$found/$CC_REL" ]; then
            echo "ANDROID_NDK_HOME 指向的目录里没有 $CC_REL，改扫候选"
            found=""
            for c in /usr/local/lib/android/sdk/ndk/*; do
              if [ -x "$c/$CC_REL" ]; then found="$c"; break; fi
            done
          fi
          if [ -z "$found" ]; then
            echo "runner 上没有现成 NDK，回落 sdkmanager 安装"
            command -v java >/dev/null || { echo "回落安装需要 Java，runner 上却没有" >&2; exit 1; }
            export ANDROID_HOME="$PWD/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL -o ct.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q ct.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" --update >/dev/null 2>&1 || true
            for pkg in "ndk;r27.2.12479018" "ndk;27.0.12077973" "ndk;26.3.11579264"; do
              if "$SM" "$pkg" >/dev/null 2>&1; then
                found="$ANDROID_HOME/ndk/${pkg#ndk;}"
                break
              fi
            done
          fi
          if [ -z "$found" ]; then
            echo "拿不到任何可用 NDK" >&2
            exit 1
          fi
          echo "使用 NDK：$found"
          ls "$found/toolchains/llvm/prebuilt/linux-x86_64/bin" | grep -c clang || true
          echo "ANDROID_NDK_HOME=$found" >> "$GITHUB_ENV"

      - name: 编译
        run: |
          set -euo pipefail
          sh build.sh
          ls -l out/
          head -c 20 out/bthci-bridge | od -c | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: bthci-bridge-aarch64
          path: out/bthci-bridge
          if-no-files-found: error
